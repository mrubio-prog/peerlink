<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>Peerlink</title><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23059669'/><path d='M7 11.5h17M19.5 7l4.5 4.5-4.5 4.5M25 20.5H8M12.5 16 8 20.5l4.5 4.5' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/></svg>">

</head><body>
<header class="topbar">
<a class="brand" href="#inbox" aria-label="Peerlink, Inbox"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--acc)"/><path d="M7 11.5h17M19.5 7l4.5 4.5-4.5 4.5M25 20.5H8M12.5 16 8 20.5l4.5 4.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Peerlink</span></a>
<nav class="tabs" id="tabs" aria-label="Pages"></nav>
<span class="spacer"></span>
<div class="jump"><input id="jumpq" type="search" placeholder="Jump to agent, task, page" aria-label="Jump to an agent, task, schedule or page" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd><div class="jump-list" id="jumplist" role="listbox"></div></div>
<button type="button" class="icon-btn" id="jumpbtn" aria-label="Jump to an agent, task or page"></button>
<a class="icon-btn" id="setupbtn" href="#setup" data-tab="setup" aria-label="Setup"></a>
</header>
<div class="banners">
<div id="limitbar" class="banner warn" hidden></div>
<div id="stalebar" class="banner warn" hidden></div>
<div id="offline" class="banner bad" hidden><span id="offwhy">Can't reach the peerlink daemon. This page reconnects once it's back.</span></div>
<div id="signedout" class="banner warn" hidden>Signed out. Run <span class="mono">/peerlink web</span> in any agent to sign in again.</div>
<div id="pageerr" class="banner bad" hidden></div>
</div>
<main id="main"><div id="nopage" hidden></div></main>
<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
<div id="sheets"></div><div id="toasts" class="toasts" aria-live="polite"></div>
<!--SCRIPTS-->
</body></html>
